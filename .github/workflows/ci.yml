name: unit-tests-2

on:
  push:
    branches:
      - dev_setup
      - update_docker
      - dev
  pull_request:
    branches:
      - master
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    container:
      image: docker://hopkinsidd/cholerapipeline:v1
      options: --user root
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Layers
        uses: actions/checkout@v4
        with:
          repository: HopkinsIDD/cholera-covariates
          ref: for_testing
          path: Layers/
          lfs: true
          token: ${{ secrets.PERSONAL_TOKEN }}
      - name: Run taxdat tests
        run: |
          source /opt/miniconda3/etc/profile.d/conda.sh
          conda activate rbase
          cd packages/taxdat
          R -e "setwd('.'); devtools::test(stop_on_failure=TRUE)"
        shell: bash
      - name: Ingest Covariates
        run: |
          export CHOLERA_APP_PASSWORD=dockertest
          export PGHOST=localhost PGPORT=5432 PGDATABASE=cholera_covariates
          export PGUSER=cholera_app PGPASSWORD=dockertest
          bash ./init-postgres.sh
          source /opt/miniconda3/etc/profile.d/conda.sh
          conda activate rbase
          Rscript -e "install.packages('packages/taxdat',type='source',repos=NULL)"
          Rscript Analysis/R/prepare_grid_cmd.R -l ./Layers -r 1 -a KEN -b 50
          Rscript Analysis/R/prepare_grid_cmd.R -l ./Layers -r 20 -a KEN -b 50
          Rscript Analysis/R/prepare_covariates_cmd.R -l ./Layers -r 1 -t '1 years' -a KEN -b 50 -c p
          Rscript Analysis/R/prepare_covariates_cmd.R -l ./Layers -r 20 -t '1 years' -a KEN -b 50 -c p,dw
        shell: bash
      - name: Run integration tests
        env:
          CHOLERA_API_USERNAME: ${{ secrets.CHOLERA_API_USERNAME }}
          CHOLERA_API_KEY: ${{ secrets.CHOLERA_API_KEY }}
        run: |
          export PGHOST=localhost PGPORT=5432 PGDATABASE=cholera_covariates
          export PGUSER=cholera_app PGPASSWORD=dockertest
          pwd
          cd test
          export PRODUCTION_RUN=FALSE
          source /opt/miniconda3/etc/profile.d/conda.sh
          conda activate rbase
          Rscript run_tests.R
        shell: bash
